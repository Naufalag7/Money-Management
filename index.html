<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance | Lily & Nopal</title>
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LilyNopal">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body id="main-body" data-theme="lily">
    
    <div id="loading-overlay" class="hidden">
        <div class="loader-content">
            <img src="icon.png" id="loading-icon" class="loader-mascot" alt="Loading">
            <p class="loader-text">Memproses data...</p>
        </div>
    </div>

    <div id="toast" class="hidden">Berhasil disimpan.</div>

    <div class="container fade-in">
        <div class="mascot-container">
            <img src="icon.png" class="mascot" id="mascot-icon" alt="Mascot">
        </div>
        
        <header class="cute-header">
            <h1 class="header-title" id="active-user-title">Finance Lily</h1>
        </header>

        <div class="main-balance-card">
            <small>Sisa Uang Jajan</small>
            <h2 id="sisa-saldo">0</h2>
            
            <div id="spending-insight" class="insight-text">Mengkalkulasi data...</div>
            
            <div class="mini-summary">
                <div class="mini-box in">
                    <span>Pemasukan</span>
                    <b id="total-masuk">0</b>
                </div>
                <div class="mini-box out">
                    <span>Pengeluaran</span>
                    <b id="total-keluar">0</b>
                </div>
            </div>
        </div>

        <div class="input-card">
            <select id="in-kat" class="pill-input" onchange="filterTable()">
                <option value="Semua" selected disabled>Pilih Kategori...</option>
                <option value="Pemasukan">Pemasukan</option>
                <option value="Pengeluaran">Pengeluaran</option>
            </select>
            <input type="number" id="in-nom" placeholder="Nominal (Rp)" inputmode="numeric" class="pill-input">
            <input type="text" id="in-ket" placeholder="Keterangan (Opsional)" class="pill-input">
            <button onclick="sendData()" id="btn-send" class="btn-cute">SIMPAN</button>
        </div>

        <div class="budget-card fade-in">
            <h3 class="section-title">Budget Bulanan</h3>
            <table class="budget-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Batas</th>
                        <th>Terpakai</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="budget-table-body"></tbody>
            </table>
        </div>

        <div class="list-card">
            <div class="table-scroll" id="scroll-area">
                <table><tbody id="transaction-table"><tr><td style="text-align: center;">Mencari riwayat...</td></tr></tbody></table>
            </div>
        </div>

        <div class="days-pill">HARI BARENG LILY: <span id="days-count">0</span></div>
    </div>

    <img src="icon2.png" id="floating-sticker" alt="Ganti Akun" onclick="toggleUser()">

    <script src="script.js"></script>
</body>
</html>
